# Автозагрузка правил базы в Firebase.
# Срабатывает, когда в ветке main меняется firestore.rules,
# или вручную: вкладка Actions → «Загрузка правил в Firebase» → Run workflow.
name: Загрузка правил в Firebase

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

concurrency:
  group: firebase-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ключ доступа к Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Нет секрета FIREBASE_SERVICE_ACCOUNT. Добавьте его: Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Загрузить правила
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project window-5b98a --non-interactive

      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
